<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tharrn HUD mock-up</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* HUD mock-up (draft 1): The Division 2's arrangement (player status and map bottom left, weapon bottom right,
     tracker top left, a compass at the top) with ARK's survival meters. Values are the game's real data (P4, P5). */
  .screen { background-image: url(backdrops/hud_jungle.jpg); }
  .hud { position: absolute; inset: var(--safe-y) var(--safe-x); }

  /* Tracker */
  .tracker { position: absolute; left: 0; top: 0; width: 380px; }
  .tracker .title { font-size: 22px; margin: 8px 0 4px; }
  .tracker .dist { font: 500 16px/1.3 var(--font-body); color: var(--ink); }
  .tracker .step { display: flex; align-items: center; gap: 10px; margin-top: 10px; font: 500 16px/1.2 var(--font-body); color: var(--ink); }
  .tracker .box { width: 12px; height: 12px; border: 1.5px solid var(--ink-2); }
  .tracker .box.done { background: var(--exodus); border-color: var(--exodus); }
  .tracker .step.done { color: var(--ink-2); text-decoration: line-through; }

  /* Compass */
  .compass { position: absolute; left: 50%; top: 0; width: 640px; transform: translateX(-50%); text-align: center; }
  .strip { position: relative; height: 34px; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
  .strip .ticks-row { position: absolute; left: 0; top: 0; height: 100%; display: flex; align-items: flex-end; }
  .strip .tick { width: 32px; flex: none; position: relative; height: 100%; }
  .strip .tick::after { content: ""; position: absolute; left: 50%; bottom: 0; width: 2px; height: 8px; background: var(--ink); box-shadow: 0 0 3px rgba(0,0,0,.8); }
  .strip .tick.major::after { height: 14px; }
  .strip .tick b { position: absolute; left: 50%; top: 0; transform: translateX(-50%); font: 700 16px/1 var(--font-head); letter-spacing: .1em; }
  .strip .marker { position: absolute; top: 2px; transform: translateX(-50%); }
  .bearing { display: inline-block; margin-top: 4px; padding: 2px 8px; font: 600 14px/1 var(--font-num); border: 1px solid var(--line-2); background: var(--glass); }
  .zone { margin-top: 10px; display: inline-flex; align-items: center; gap: 12px; font: 600 15px/1 var(--font-head); letter-spacing: .16em; text-transform: uppercase; color: var(--ink); }
  .zone .safe { color: var(--safe); display: inline-flex; align-items: center; gap: 6px; }
  .zone .time { color: var(--ink-2); font-family: var(--font-num); letter-spacing: .05em; }

  /* Crosshair and prompt */
  .cross { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
  .cross i { position: absolute; background: rgba(255,255,255,.92); box-shadow: 0 0 2px rgba(0,0,0,.8); }
  .cross .t { left: -1px; top: -22px; width: 2px; height: 12px; } .cross .b { left: -1px; top: 10px; width: 2px; height: 12px; }
  .cross .l { top: -1px; left: -22px; width: 12px; height: 2px; } .cross .r { top: -1px; left: 10px; width: 12px; height: 2px; }
  .cross .c { left: -1.5px; top: -1.5px; width: 3px; height: 3px; }
  .use { position: absolute; left: calc(50% + 60px - var(--safe-x)); top: calc(50% + 40px - var(--safe-y)); }

  /* Loot feed */
  .feed { position: absolute; right: 0; bottom: 250px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .feed .toast { min-width: 260px; justify-content: space-between; }
  .feed .toast span { display: inline-flex; align-items: center; gap: 10px; }

  /* Player status, bottom left: tilted a little, as if floating beside the player */
  .status { position: absolute; left: 0; bottom: 0; width: 520px; transform: perspective(1200px) rotateY(9deg); transform-origin: left bottom; }
  .who { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .who .name { font: 700 22px/1 var(--font-head); letter-spacing: .14em; text-transform: uppercase; }
  .who .lv { font: 600 14px/1 var(--font-num); color: var(--exodus); border: 1px solid var(--exodus-line); padding: 3px 6px; }
  .who .armour { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font: 600 14px/1 var(--font-num); color: var(--armour); }
  .hp { display: flex; align-items: center; gap: 12px; }
  .hp .bar { flex: 1; height: 12px; }
  .hp .val { font: 700 24px/1 var(--font-num); min-width: 46px; text-align: right; }
  .meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
  .meter { display: flex; align-items: center; gap: 8px; }
  .meter .ico { width: 20px; height: 20px; flex: none; }
  .meter .bar { flex: 1; height: 5px; }
  .meter .v { font: 600 15px/1 var(--font-num); color: var(--ink); min-width: 38px; text-align: right; }
  .row-min { display: flex; gap: 16px; align-items: flex-end; margin-top: 16px; }
  .minimap { position: relative; width: 196px; height: 196px; flex: none; border: 1px solid var(--line-2); overflow: hidden;
    background: url(../pictures/p6/test_coast_map.jpg) center / 180% no-repeat; filter: saturate(.25) brightness(.7) contrast(1.15); }
  .minimap-wrap { position: relative; width: 196px; height: 196px; }
  .minimap-wrap .me { position: absolute; left: 50%; top: 50%; width: 0; height: 0; border-left: 7px solid transparent;
    border-right: 7px solid transparent; border-bottom: 16px solid var(--exodus); transform: translate(-50%, -60%) rotate(42deg); }
  .minimap-wrap .n { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); font: 700 13px/1 var(--font-head); }
  .minimap-wrap .obj { position: absolute; right: 30px; top: 40px; color: var(--exodus); }
  .carry { font: 500 15px/1.4 var(--font-body); color: var(--ink); }
  .carry b { font: 600 15px/1 var(--font-num); color: var(--ink); }

  /* Hotbar */
  .hotbar { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); display: flex; gap: 4px; }
  .hotbar .slot { width: 62px; height: 62px; background: var(--glass); backdrop-filter: blur(var(--blur)); }
  .hotbar .slot svg { width: 30px; height: 30px; }
  .hotbar-name { position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%); font: 600 15px/1 var(--font-head); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-2); }

  /* Weapon, bottom right, tilted the other way */
  .weapon { position: absolute; right: 0; bottom: 0; width: 360px; text-align: right; transform: perspective(1200px) rotateY(-9deg); transform-origin: right bottom; }
  .weapon .wname { font: 700 20px/1 var(--font-head); letter-spacing: .14em; text-transform: uppercase; }
  .weapon .wsub { margin-top: 6px; font: 600 14px/1 var(--font-head); letter-spacing: .16em; color: var(--ink-2); text-transform: uppercase; }
  .weapon .ammo { display: flex; align-items: flex-end; justify-content: flex-end; gap: 10px; margin-top: 10px; }
  .weapon .mag { font: 700 64px/0.85 var(--font-num); }
  .weapon .res { font: 600 24px/1 var(--font-num); color: var(--ink-2); padding-bottom: 4px; }
  .weapon .magbar { display: flex; gap: 2px; justify-content: flex-end; margin-top: 10px; }
  .weapon .magbar i { width: 5px; height: 12px; background: var(--ink); }
  .weapon .magbar i.spent { background: rgba(255,255,255,.18); }
  .weapon .gren { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; font: 600 15px/1 var(--font-num); color: var(--ink-2); }
</style>
</head>
<body>
<div class="screen scrim">
  <div class="hud hud-text">

    <div class="tracker">
      <div class="label accent">Current objective</div>
      <div class="title">Recover the beacon core</div>
      <div class="dist">Crash site · 320 m</div>
      <div class="step done"><i class="box done"></i>Leave the wreck</div>
      <div class="step"><i class="box"></i>Reach the beacon</div>
    </div>

    <div class="compass">
      <div class="strip"><div class="ticks-row" id="ticks"></div>
        <div class="marker" style="left: 64%; color: var(--exodus)"><i data-ico="objective" style="width:18px;height:18px"></i></div>
        <div class="marker" style="left: 18%; color: var(--pvp)"><i data-ico="pvp" style="width:16px;height:16px"></i></div>
      </div>
      <div class="bearing">042</div><br>
      <div class="zone"><span class="safe"><i data-ico="safe" style="width:16px;height:16px"></i>Safe hub</span><span>Coastal Outpost</span><span class="time">09:42</span></div>
    </div>

    <div class="cross"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="c"></i></div>
    <div class="use prompt">
      <span class="key accent">E</span>
      <div><div class="main">Pick up</div><div class="sub">Mineral ×3</div></div>
    </div>

    <div class="feed">
      <div class="toast" style="border-right-color: var(--tier-common)"><span><i data-ico="organic"></i>Organic fibre</span><span class="plus">+3</span></div>
      <div class="toast" style="border-right-color: var(--tier-common)"><span><i data-ico="mineral"></i>Mineral</span><span class="plus">+2</span></div>
    </div>

    <div class="status">
      <div class="who"><span class="name">Rook</span><span class="lv">LV 7</span>
        <span class="armour"><i data-ico="armour" style="width:16px;height:16px"></i>10%</span></div>
      <div class="hp"><div class="bar"><i style="width: 94%; background: var(--health)"></i><i class="loss" style="left: 94%; width: 4%"></i></div><span class="val">94</span></div>
      <div class="meters">
        <div class="meter" style="color: var(--stamina)"><i data-ico="stamina"></i><div class="bar"><i style="width: 100%; background: var(--stamina)"></i></div><span class="v">100</span></div>
        <div class="meter" style="color: var(--hunger)"><i data-ico="hunger"></i><div class="bar"><i style="width: 58%; background: var(--hunger)"></i></div><span class="v">58%</span></div>
        <div class="meter" style="color: var(--hydration)"><i data-ico="hydration"></i><div class="bar"><i style="width: 72%; background: var(--hydration)"></i></div><span class="v">72%</span></div>
        <div class="meter" style="color: var(--safe)"><i data-ico="temperature"></i><div class="bar"><i style="left: 33%; width: 34%; background: rgba(61,220,151,.35)"></i><i style="left: 48%; width: 3px; background: var(--ink)"></i></div><span class="v">20°C</span></div>
      </div>
      <div class="row-min">
        <div class="minimap-wrap"><div class="minimap"></div><span class="n">N</span><span class="me"></span>
          <span class="obj"><i data-ico="objective" style="width:16px;height:16px"></i></span></div>
        <div class="carry">Carrying<br><b>18.2</b> / 60 kg</div>
      </div>
    </div>

    <div class="hotbar-name">SMG A1</div>
    <div class="hotbar" id="hotbar"></div>

    <div class="weapon">
      <div class="wname">SMG A1</div>
      <div class="wsub">Auto · SMG rounds</div>
      <div class="ammo"><span class="mag">34</span><span class="res">/ 160</span></div>
      <div class="magbar" id="magbar"></div>
      <div class="gren"><i data-ico="grenade" style="width:18px;height:18px"></i>Frag ×4 <span class="key" style="margin-left:6px">4</span></div>
    </div>

  </div>
</div>
<script>
  // Compass: 15 degree ticks, letters on the cardinals, centred on bearing 042.
  const names = { 0: 'N', 45: 'NE', 90: 'E', 135: 'SE', 180: 'S', 225: 'SW', 270: 'W', 315: 'NW' };
  const ticks = document.getElementById('ticks');
  let html = '';
  for (let d = -180; d <= 270; d += 15) {
    const a = ((d % 360) + 360) % 360;
    html += '<div class="tick' + (a % 45 === 0 ? ' major' : '') + '">' + (names[a] ? '<b>' + names[a] + '</b>' : '') + '</div>';
  }
  ticks.innerHTML = html;
  ticks.style.left = (320 - 16 - (42 + 180) / 15 * 32) + 'px';
  // Hotbar: the real starting kit (Data/StartingKit.csv) and its keys.
  const keys = ['1','2','3','4','5','6','7','8','9','0','-','='];
  const kit = [['rifle', '34', 1], ['pistol', '12'], ['launcher', '2'], ['grenade', '4'], ['bandage', '3'], ['ration', '2'], ['water', '1']];
  document.getElementById('hotbar').innerHTML = keys.map((k, i) => {
    const it = kit[i];
    return '<div class="slot' + (it ? (it[2] ? ' on' : '') : ' empty') + '"><span class="k">' + k + '</span>' +
      (it ? '<i data-ico="' + it[0] + '"></i><span class="count">' + it[1] + '</span><span class="tier" style="background:var(--tier-common)"></span>' : '') + '</div>';
  }).join('');
  document.getElementById('magbar').innerHTML = Array.from({ length: 40 }, (_, i) => '<i' + (i >= 34 ? ' class="spent"' : '') + '></i>').join('');
</script>
<script src="icons.js"></script>
</body>
</html>
