<title>Clover Creek Farm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: full-screen isometric farm canvas, HUD pinned to the safe-area edges, bottom sheets for every panel. */
:root{
  --ink:#3a2814; --cream:#FFF7E6; --paper:#FCEBC8; --paperD:#E9CF9C;
  --orange:#F59A23; --orangeD:#C46A0C; --green:#5CBF3A; --greenD:#3A8A1E;
  --blue:#3D8EE6; --blueD:#255FA6; --red:#E5483D; --redD:#A82A22;
  --pill:rgba(36,40,64,.62); --gold:#FFC83A;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#DCE8F3;overscroll-behavior:none}
body{font-family:var(--f-body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.3px}

/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud > *{pointer-events:auto}
#topL{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;max-width:46vw}
#lvl{display:flex;align-items:center;gap:0;cursor:pointer;background:none;border:0;padding:0}
#lvlStar{width:44px;height:44px;position:relative;z-index:1;display:grid;place-items:center;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
#lvlStar svg{position:absolute;inset:0}
#lvlStar span{position:relative;color:#fff;font-family:var(--f-display);font-size:17px;text-shadow:0 2px 0 var(--blueD)}
#xpBar{margin-left:-14px;width:92px;height:18px;border-radius:0 10px 10px 0;background:var(--pill);overflow:hidden;position:relative;border:2px solid rgba(255,255,255,.5)}
#xpFill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#7FD0FF,#3D8EE6);width:0}
#xpTxt{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:900;text-shadow:0 1px 1px #000}
#quest{background:var(--cream);border:3px solid var(--orange);border-radius:14px;padding:6px 9px;box-shadow:0 3px 0 var(--orangeD);text-align:left;font-size:12px;line-height:1.25;color:var(--ink);max-width:200px}
#quest b{display:block;font-family:var(--f-display);font-weight:400;font-size:11px;color:var(--orangeD);letter-spacing:.5px;text-transform:uppercase}
#quest .qbar{height:6px;background:#EBD9B4;border-radius:4px;margin-top:4px;overflow:hidden}
#quest .qbar i{display:block;height:100%;background:var(--green)}
#quest.ready{animation:pulse 1s infinite;border-color:var(--green);box-shadow:0 3px 0 var(--greenD)}
@keyframes pulse{50%{transform:scale(1.05)}}
#topR{position:absolute;right:calc(8px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px 6px;max-width:54vw}
.pill{display:flex;align-items:center;height:28px;padding:0 10px 0 0;background:var(--pill);border-radius:16px;color:#fff;font-family:var(--f-display);font-size:15px;border:2px solid rgba(255,255,255,.35);margin-left:14px}
.pill .ic{width:32px;height:32px;margin:-4px 4px 0 -16px;display:grid;place-items:center;font-size:22px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.pill .plus{margin-left:6px;width:18px;height:18px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:13px;line-height:1}
#gear{width:32px;height:32px;border-radius:50%;background:var(--pill);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:17px;display:grid;place-items:center;padding:0}
#rightBar{position:absolute;right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;align-items:flex-end}
#leftBar{position:absolute;left:calc(8px + env(safe-area-inset-left,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:9px;align-items:flex-start}
.rbtn{position:relative;width:56px;height:56px;border-radius:16px;background:linear-gradient(#FFF9EC,#F7E4BD);border:3px solid var(--orange);box-shadow:0 4px 0 var(--orangeD),0 6px 10px rgba(0,0,0,.25);display:grid;place-items:center;font-size:28px;padding:0;line-height:1}
.rbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--orangeD)}
.rbtn small{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--orange);color:#fff;font-family:var(--f-display);font-size:10px;padding:1px 6px;border-radius:8px;white-space:nowrap;letter-spacing:.3px}
.rbtn .badge{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-family:var(--f-display);font-size:12px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.rbtn.green{border-color:var(--green);box-shadow:0 4px 0 var(--greenD),0 6px 10px rgba(0,0,0,.25)}
.rbtn.green small{background:var(--green)}
#dayChip{background:var(--pill);color:#fff;border-radius:12px;padding:4px 10px;font-size:12px;font-weight:800;border:2px solid rgba(255,255,255,.35)}
.row-btns{display:flex;gap:9px}

/* ---- Sheets ---- */
#sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(600px,100%);max-height:min(78%,640px);display:flex;flex-direction:column;background:var(--paper);border:4px solid var(--orange);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.3);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;animation:up .18s ease-out}
@keyframes up{from{transform:translate(-50%,40px);opacity:.4}}
#sheetHead{display:flex;align-items:center;gap:10px;padding:10px 12px 8px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(#FFB44A,var(--orange));border-radius:17px 17px 0 0;color:#fff}
#sheetTitle{flex:1;min-width:0;font-family:var(--f-display);font-size:21px;text-shadow:0 2px 0 var(--orangeD);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sheetClose{width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:var(--red);color:#fff;font-family:var(--f-display);font-size:18px;box-shadow:0 3px 0 var(--redD);padding:0;line-height:1}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px max(12px,env(safe-area-inset-right,0px)) 16px max(12px,env(safe-area-inset-left,0px));touch-action:pan-y;display:flex;flex-direction:column;gap:12px}
.sec{font-family:var(--f-display);font-size:15px;color:var(--orangeD);letter-spacing:.4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.card{background:var(--cream);border:2px solid var(--paperD);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;font-size:12px;min-width:0}
button.card{color:var(--ink)}
button.card:active{transform:scale(.96)}
.card .big{font-size:32px;line-height:1.1}
.card .nm{font-weight:900;font-size:13px;line-height:1.1}
.card .sub{color:#8a6a3f;font-size:11px;font-weight:800}
.card.locked{opacity:.55;filter:grayscale(.7)}
.card.sel{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.list{display:flex;flex-direction:column;gap:8px}
.line{display:flex;align-items:center;gap:10px;background:var(--cream);border:2px solid var(--paperD);border-radius:14px;padding:8px 10px}
.line .ico{font-size:30px;width:40px;text-align:center;flex:none}
.line .mid{flex:1;min-width:0}
.line .mid .nm{font-weight:900;font-size:14px}
.line .mid .sub{font-size:12px;color:#8a6a3f;font-weight:800}
.line.locked{opacity:.55}
.btn{border:0;border-radius:12px;padding:8px 12px;font-family:var(--f-display);font-size:15px;color:#fff;background:var(--green);box-shadow:0 3px 0 var(--greenD);text-shadow:0 1px 0 rgba(0,0,0,.25);white-space:nowrap;letter-spacing:.3px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--greenD)}
.btn.blue{background:var(--blue);box-shadow:0 3px 0 var(--blueD)}
.btn.orange{background:var(--orange);box-shadow:0 3px 0 var(--orangeD)}
.btn.red{background:var(--red);box-shadow:0 3px 0 var(--redD)}
.btn.small{font-size:13px;padding:6px 9px}
.btn[disabled]{background:#B9AB93;box-shadow:0 3px 0 #8F8270;opacity:.85}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.ing{display:inline-flex;align-items:center;gap:1px;font-weight:900;font-size:12px;margin-right:6px;white-space:nowrap}
.ing.ok{color:var(--greenD)} .ing.no{color:var(--redD)}
.bar{height:10px;background:#E5D0A6;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(#8BE06A,var(--green));width:0}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{width:52px;height:52px;border-radius:12px;background:var(--cream);border:2px dashed var(--paperD);display:grid;place-items:center;font-size:24px;position:relative}
.slot.full{border-style:solid}
.slot.done{border-color:var(--green);background:#E9FBDD}
.slot em{position:absolute;bottom:-2px;left:0;right:0;font-style:normal;font-size:10px;font-weight:900;text-align:center;color:var(--ink)}
.order{background:var(--cream);border:2px solid var(--paperD);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.order.can{border-color:var(--green);box-shadow:0 0 0 2px #BDEB9F}
.order .its{display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:center;min-height:36px;align-items:center}
.order .it{display:flex;flex-direction:column;align-items:center;font-size:24px;line-height:1}
.order .it span{font-size:11px;font-weight:900}
.order .rw{display:flex;justify-content:center;gap:8px;font-weight:900;font-size:13px}
.order .wait{text-align:center;color:#8a6a3f;font-weight:800;font-size:12px;padding:18px 0}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;touch-action:pan-x;padding-bottom:2px}
.tab{border:0;border-radius:12px;padding:7px 12px;background:#E9D3A6;color:var(--ink);font-family:var(--f-display);font-size:14px;white-space:nowrap}
.tab.on{background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blueD)}
.note{font-size:13px;font-weight:800;color:#7a5a30;line-height:1.4}
.note p{margin:0 0 6px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:900}
.sw{width:52px;height:30px;border-radius:16px;background:#C9B48C;border:0;position:relative;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--green)} .sw.on::after{left:25px}

/* ---- Placement bar, toast, modal ---- */
#placeBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;background:var(--cream);border:3px solid var(--orange);border-radius:18px;padding:8px 10px;box-shadow:0 4px 0 var(--orangeD),0 8px 20px rgba(0,0,0,.3);z-index:4;width:min(420px,calc(100% - 24px));box-sizing:border-box}
#placeBar .pinfo{flex:1;min-width:0;font-size:12px;font-weight:800;line-height:1.25}
#placeBar .pinfo b{font-family:var(--f-display);font-weight:400;font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circ{width:48px;height:48px;border-radius:50%;border:3px solid #fff;font-size:24px;color:#fff;padding:0;flex:none;font-family:var(--f-display)}
.circ.ok{background:var(--green);box-shadow:0 3px 0 var(--greenD)}
.circ.no{background:var(--red);box-shadow:0 3px 0 var(--redD)}
.circ.rot{background:var(--blue);box-shadow:0 3px 0 var(--blueD)}
.circ[disabled]{background:#B9AB93;box-shadow:0 3px 0 #8F8270}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(36,40,64,.88);color:#fff;font-weight:900;font-size:14px;padding:8px 16px;border-radius:14px;z-index:9;pointer-events:none;opacity:0;transition:opacity .2s;max-width:86vw;text-align:center}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(20,24,40,.55);display:grid;place-items:center;z-index:8;padding:16px}
#modalBox{width:min(380px,100%);max-height:86%;overflow:auto;background:var(--paper);border:4px solid var(--orange);border-radius:22px;padding:16px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px;animation:pop .25s ease-out;touch-action:pan-y}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#modalBox h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--orangeD);text-wrap:balance}
#modalBox .unl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#modalBox .unl span{background:var(--cream);border:2px solid var(--paperD);border-radius:10px;padding:4px 8px;font-weight:900;font-size:13px}
@media (prefers-reduced-motion:reduce){#quest.ready{animation:none}#sheet,#modalBox{animation:none}}
@media (max-height:460px){.rbtn{width:46px;height:46px;font-size:23px;border-radius:13px}#rightBar,#leftBar{gap:7px}#sheet{max-height:88%}#quest{max-width:170px;font-size:11px}}
</style>

<canvas id="c"></canvas>
<div id="hud">
  <div id="topL">

</div>
<div id="sheet" hidden><div id="sheetHead"><div id="sheetTitle"></div><button id="sheetClose" aria-label="Close">✕</button></div><div id="sheetBody"></div></div>

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function hash(x,y,s=0){ let h = (x*374761393 + y*668265263 + s*982451653) | 0; h = (h ^ (h>>>13)) * 1274126177 | 0; return ((h ^ (h>>>16)) >>> 0) / 4294967296; }
function fmtT(ms){ let s = Math.max(0, Math.ceil(ms/1000)); if (s < 60) return s+'s'; let m = Math.floor(s/60); s %= 60; if (m < 60) return m+'m'+(s?' '+s+'s':''); const h = Math.floor(m/60); m %= 60; return h+'h'+(m?' '+m+'m':''); }
function fmtN(n){ n = Math.floor(n); if (n >= 1e6) return (n/1e6).toFixed(n>=1e7?0:1)+'M'; if (n >= 1e5) return Math.floor(n/1000)+'K'; return n.toLocaleString('en-US'); }
function shade(hex, f){ const n = parseInt(hex.slice(1),16); let r=n>>16, g=(n>>8)&255, b=n&255; if (f<0){ r*=1+f; g*=1+f; b*=1+f; } else { r+=(255-r)*f; g+=(255-g)*f; b+=(255-b)*f; } return 'rgb('+Math.round(r)+','+Math.round(g)+','+Math.round(b)+')'; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function addObj(type,gx,gy){
  const o = {id:S.nextId++, type, gx, gy};
  const d = defOf(type);
  if (d.cat==='field'){ o.crop=null; o.readyAt=0; o.last=null; }
  if (d.cat==='pen'){ o.slots = Array(d.start).fill(0); }
  if (d.cat==='factory'){ o.queue = []; o.cap = 3; o.lastR = 0; }
  S.objects.push(o); occDirty = true;
  return o;
}
function countType(t){ return S.objects.filter(o=>o.type===t).length; }
function objById(id){ return S.objects.find(o=>o.id===id); }

function save(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e) {}

function load(){
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return sanitize(JSON.parse(raw)); } catch(e) {}
  return null;
}
function sanitize(s){
  if (!s || s.v !== 1 || !Array.isArray(s.objects)) return null;
  const base = {coins:0,clovers:0,xp:0,level:1,inv:{},barnLvl:0,nextId:1,blocks:['1,1','2,1','1,2','2,2'],orders:[],staff:{field:0,ranch:0,factory:0},upg:{},quest:0,playTime:0,day:0,resting:false,welcomed:true};
  for (const k in base) if (s[k]===undefined) s[k]=base[k];
  s.stats = Object.assign({hv:{},planted:0,orders:0,prod:{},coinsEarned:0,expansions:0,decor:0,cleared:0}, s.stats||{});
  s.settings = Object.assign({sound:true,snow:true,plantAll:true}, s.settings||{});
  s.objects = s.objects.filter(o => o && o.type && defOf(o.type).cat !== '?');
  for (const o of s.objects){ const d = defOf(o.type); if (d.cat==='factory' && !Array.isArray(o.queue)) o.queue=[]; if (d.cat==='pen' && !Array.isArray(o.slots)) o.slots=Array(d.start).fill(0); }
  while (s.orders.length < 6) s.orders.push({wait: now()});
  for (const k in s.inv) if (!ITEMS[k] || !(s.inv[k] > 0)) delete s.inv[k];
  return s;
}

function spendClovers(n){ if (S.clovers < n) { toast('Not enough clovers — earn them by levelling up'); sfx('no'); return false; } S.clovers -= n; return true; }

function addXP(n){
  if (n<=0) return;
  S.xp += n;
  while (S.level < MAX_LEVEL && S.xp >= xpNeed(S.level)) { S.xp -= xpNeed(S.level); S.level++; levelUp(S.level); }
  if (S.level >= MAX_LEVEL) S.xp = Math.min(S.xp, xpNeed(S.level));
}
function levelUp(l){
  const coins = 25*l, clov = 3;
  addCoins(coins); S.clovers += clov;
  const unl = [];
  for (const k in CROPS) if (CROPS[k].lvl===l) unl.push(CROPS[k].e+' '+CROPS[k].n);
  for (const k in FACTORIES) if (FACTORIES[k].lvl===l) unl.push('🏭 '+FACTORIES[k].n);
  for (const k in FACTORIES) FACTORIES[k].recipes.forEach(r=>{ if (r.lvl===l && FACTORIES[k].lvl!==l) unl.push(ITEMS[r.out].e+' '+ITEMS[r.out].n); });
  for (const k in PENS) if (PENS[k].lvl===l) unl.push(ITEMS[PENS[k].out].e+' '+PENS[k].n);
  for (const k in DECOR) if (DECOR[k].lvl===l) unl.push(DECOR[k].e+' '+DECOR[k].n);
  for (const k in UPG) UPG[k].lv.forEach((lv,i)=>{ if (lv===l) unl.push(UPG[k].e+' '+UPG[k].n+(UPG[k].lv.length>1?' '+(i+1):'')); });
  for (const k in STAFF) if (STAFF[k].lvl===l) unl.push(STAFF[k].e+' '+STAFF[k].n);
  const ex = S.stats.expansions; if (expandLvl(ex)===l && ex < NB*NB-4) unl.push('🗺️ New land');
  sfx('level'); burst(innerWidth/2, innerHeight/2, 40);
  showModal(`<div style="font-size:54px;line-height:1">⭐</div><h2>Level ${l}!</h2>
    <div class="note">You earned <b>🪙 ${coins}</b> and <b>🍀 ${clov}</b>.</div>
    ${unl.length?`<div class="sec">Now available</div><div class="unl">${unl.map(u=>`<span>${esc(u)}</span>`).join('')}</div>`:''}
    <button class="btn" data-act="closeModal" style="font-size:18px;padding:10px">Great!</button>`);
}

/* ---------------- Orders ---------------- */
function producible(){
  // Items the player can actually make right now with unlocked crops and owned buildings
  const can = new Set();
  for (const k in CROPS) if (CROPS[k].lvl <= S.level) can.add(k);
  const owned = new Set(S.objects.map(o=>o.type));
  let grew = true;
  while (grew){
    grew = false;
    for (const r of ALL_RECIPES){
      if (can.has(r.out) || !owned.has(r.src) || r.lvl > S.level) continue;
      if (Object.keys(r.inp).every(k=>can.has(k))){ can.add(r.out); grew = true; }
    }
  }
  return can;
}
function orderPool(){ return [...producible()].filter(k=>ITEMS[k].kind!=='feed'); }
function makeOrder(){
  const pool = orderPool();
  const kinds = Math.min(pool.length, 1 + rnd(0, Math.min(2, Math.floor(S.level/3))));
  const items = {};
  const shuffled = pool.slice().sort(()=>Math.random()-0.5);
  // Favor newer items a little
  shuffled.sort((a,b)=> (Math.random()<0.35 ? (ITEMS[b].v-ITEMS[a].v) : 0));
  for (let i=0;i<kinds;i++){
    const k = shuffled[i];
    const q = ITEMS[k].kind==='crop' ? rnd(2, Math.min(10, 3+Math.floor(S.level/3))) : rnd(1, Math.min(4, 1+Math.floor(S.level/5)));
    items[k] = q;
  }
  let val = 0; for (const k in items) val += ITEMS[k].v*items[k];
  return {items, base: Math.round(val*(1.5+Math.random()*0.35)), xp: Math.max(2, Math.round(val*0.3)), clovers: Math.random()<0.08 ? 1 : 0};
}
const orderCoins = o => Math.round(o.base * (1 + charmBonus()/100 + 0.1*(S.upg.truck||0)));
function canFill(o){ if (!o.items) return false; for (const k in o.items) if (have(k) < o.items[k]) return false; return true; }
function deliver(i){
  const o = S.orders[i]; if (!o || !canFill(o)) return;
  for (const k in o.items) addItem(k, -o.items[k]);
  const c = orderCoins(o);
  addCoins(c); S.clovers += o.clovers; S.stats.orders++;
  S.orders[i] = {wait: now() + 3000};
  sfx('coin'); toast(`Order delivered! +🪙${c}  +⭐${o.xp}${o.clovers?'  +🍀1':''}`);
  addXP(o.xp);
  refresh();
}
function trashOrder(i){ S.orders[i] = {wait: now() + 12000}; refresh(); }
function tickOrders(){
  let ch = false;
  for (let i=0;i<S.orders.length;i++){ const o = S.orders[i]; if (o.wait && o.wait <= now()) { S.orders[i] = makeOrder(); ch = true; } }
  return ch;
}

/* ---------------- Map / occupancy ---------------- */
let occ = null, occDirty = true;
function blockOf(gx,gy){ return Math.floor(gx/BLOCK)+','+Math.floor(gy/BLOCK); }
function isUnlocked(gx,gy){ return gx>=0 && gy>=0 && gx<MAP && gy<MAP && S.blocks.includes(blockOf(gx,gy)); }
function rebuildOcc(){
  occ = new Int32Array(MAP*MAP);
  for (const o of S.objects){ const s = defOf(o.type).size; for (let x=o.gx;x<o.gx+s;x++) for (let y=o.gy;y<o.gy+s;y++) if (x>=0&&y>=0&&x<MAP&&y<MAP) occ[y*MAP+x] = o.id; }
  occDirty = false;
}
function canPlace(type,gx,gy,ignoreId){
  if (occDirty) rebuildOcc();
  const s = defOf(type).size;
  for (let x=gx;x<gx+s;x++) for (let y=gy;y<gy+s;y++){
    if (!isUnlocked(x,y)) return false;
    const id = occ[y*MAP+x]; if (id && id !== ignoreId) return false;
  }
  return true;
}
function expandable(bx,by){
  const k = bx+','+by; if (S.blocks.includes(k)) return false;
  if (bx<0||by<0||bx>=NB||by>=NB) return false;
  return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>S.blocks.includes((bx+dx)+','+(by+dy)));
}
function buyExpansion(bx,by){
  const n = S.stats.expansions, cost = expandCost(n), lv = expandLvl(n);
  if (S.level < lv) { toast(`Reach level ${lv} to expand`); return; }
  if (!spend(cost)) return;
  S.blocks.push(bx+','+by); S.stats.expansions++;
  // leftover wild growth to clear
  for (let x=bx*BLOCK; x<bx*BLOCK+BLOCK; x++) for (let y=by*BLOCK; y<by*BLOCK+BLOCK; y++){
    const h = hash(x,y,7);
    if (h < 0.13) addObj(h<0.05?'wtree':h<0.08?'rock':h<0.11?'bush':'stump', x, y);
  }
  occDirty = true; addXP(20 + n*10); sfx('level');
  const c = toScreen(gridToWorld(bx*BLOCK+3, by*BLOCK+3)); burst(c.x, c.y, 30);
  toast('New land unlocked! Clear the wild growth to make room.');
  closeSheet(); refresh();
}

/* ---------------- Actions ---------------- */
function cropReady(o){ return o.crop && o.readyAt <= now(); }
function harvestField(o, quiet){
  if (!cropReady(o)) return false;
  let n = 2; const f = S.upg.fert||0; if (f && Math.random() < 0.15*f) n++;
  if (barnFree() < n) { if (!quiet) { toast('Your barn is full — sell goods or upgrade the barn'); sfx('no'); } return false; }
  const k = o.crop; addItem(k,n); S.stats.hv[k] = (S.stats.hv[k]||0) + n;
  addXP(Math.max(1, Math.round(ITEMS[k].xp*n/2)));
  o.last = k; o.crop = null; o.readyAt = 0;
  floatText(o, `+${n} ${ITEMS[k].e}`); sfx('pop');
  return true;
}
function plantField(o, k, quiet){
  if (o.crop) return false;
  const c = CROPS[k]; if (!c || c.lvl > S.level) return false;
  if (S.coins < c.seed) { if (!quiet) { toast('Not enough coins for seeds'); sfx('no'); } return false; }
  S.coins -= c.seed; o.crop = k; o.last = k; o.readyAt = now() + c.t*1000*growMult(); S.stats.planted++;
  return true;
}
function penInfo(o){ const t = now(); let hungry=0, busy=0, ready=0, next=Infinity; for (const sl of o.slots){ if (!sl) hungry++; else if (sl<=t) ready++; else { busy++; next=Math.min(next,sl);} } return {hungry,busy,ready,next}; }
function collectPen(o, quiet){
  const d = PENS[o.type]; let got = 0; const t = now();
  for (let i=0;i<o.slots.length;i++) if (o.slots[i] && o.slots[i] <= t) {
    if (barnFree() < 1) { if (!quiet) toast('Your barn is full — sell goods or upgrade the barn'); break; }
    o.slots[i] = 0; addItem(d.out,1); got++;
  }
  if (got){ S.stats.prod[d.out] = (S.stats.prod[d.out]||0)+got; addXP(ITEMS[d.out].xp*got); floatText(o, `+${got} ${ITEMS[d.out].e}`); sfx('pop'); }
  return got;
}
function feedPen(o, quiet){
  const d = PENS[o.type]; let fed = 0;
  for (let i=0;i<o.slots.length;i++) if (!o.slots[i] && have(d.feed) > 0){ addItem(d.feed,-1); o.slots[i] = now() + d.t*1000*workMult(); fed++; }
  if (fed){ floatText(o, `-${fed} ${ITEMS[d.feed].e}`); sfx('tick'); }
  else if (!quiet) { toast(`No ${ITEMS[d.feed].n} in the barn${d.feed.endsWith('feed')?' — make some at the Feed Mill':' — grow some first'}`); sfx('no'); }
  return fed;
}
function factoryDone(o){ const t = now(); return o.queue.filter(j=>j.end<=t).length; }
function queueRecipe(o, ri){
  const f = FACTORIES[o.type], r = f.recipes[ri];
  if (!r || r.lvl > S.level) return;
  if (o.queue.length >= o.cap) { toast('Production queue is full'); sfx('no'); return; }
  for (const k in r.inp) if (have(k) < r.inp[k]) { toast(`Need more ${ITEMS[k].n}`); sfx('no'); return; }
  for (const k in r.inp) addItem(k, -r.inp[k]);
  const t = now(); const lastEnd = o.queue.length ? Math.max(t, o.queue[o.queue.length-1].end) : t;
  o.queue.push({r:ri, end: lastEnd + r.t*1000*workMult(), start: lastEnd});
  o.lastR = ri; sfx('tick'); refresh();
}
function collectFactory(o, quiet){
  const f = FACTORIES[o.type]; const t = now(); let got = 0, xp = 0, label = '';
  while (o.queue.length && o.queue[0].end <= t){
    const r = f.recipes[o.queue[0].r];
    if (barnFree() < r.qty){ if (!quiet) { toast('Your barn is full — sell goods or upgrade the barn'); sfx('no'); } break; }
    o.queue.shift(); addItem(r.out, r.qty); got += r.qty; xp += ITEMS[r.out].xp*r.qty;
    S.stats.prod[r.out] = (S.stats.prod[r.out]||0) + r.qty; label = ITEMS[r.out].e;
  }
  if (got){ addXP(xp); floatText(o, `+${got} ${label}`); sfx('pop'); }
  return got;
}
function skipCost(ms){ return Math.max(1, Math.ceil(ms/60000)); }
function skipField(o){ const c = skipCost(o.readyAt-now()); if (!spendClovers(c)) return; o.readyAt = now(); refresh(); }
function skipPen(o){ const inf = penInfo(o); if (!inf.busy) return; const c = skipCost(inf.next-now()); if (!spendClovers(c)) return; const t=now(); o.slots = o.slots.map(s=>s>t?t:s); refresh(); }
function skipFactory(o){
  const t = now(); const j = o.queue.find(j=>j.end>t); if (!j) return;
  const delta = j.end - t; if (!spendClovers(skipCost(delta))) return;
  let after = false; for (const q of o.queue){ if (q===j) after = true; if (after){ q.end -= delta; if (q.start) q.start = Math.max(t, q.start - delta); } }
  refresh();
}

/* ---------------- Staff simulation ---------------- */
let workers = [];
const claims = new Set();
function syncWorkers(){
  const home = objById(S.objects.find(o=>o.type==='farmhouse')?.id);
  const hx = home ? home.gx+1.5 : 8, hy = home ? home.gy+3.4 : 10;
  for (const role in STAFF){
    const have = workers.filter(w=>w.role===role);
    for (let i=have.length; i<S.staff[role]; i++) workers.push({role, x:hx+Math.random(), y:hy+Math.random()*0.5, tgt:null, state:'idle', wait:Math.random()*2, ph:Math.random()*6});
    for (let i=S.staff[role]; i<have.length; i++){ const w = have[i]; if (w.tgt) claims.delete(w.tgt.id); workers.splice(workers.indexOf(w),1); }
  }
}
function findJob(w){
  let best = null, bd = 1e9;
  const free = barnFree(), t = now();
  for (const o of S.objects){
    if (claims.has(o.id)) continue;
    const d = defOf(o.type); let ok = false;
    if (w.role==='field' && d.cat==='field') ok = (cropReady(o) && free >= 3) || (!o.crop && o.last && S.coins >= CROPS[o.last].seed + 20);
    if (w.role==='ranch' && d.cat==='pen'){ const inf = penInfo(o); ok = (inf.ready && free>=1) || (inf.hungry && have(PENS[o.type].feed)>0); }
    if (w.role==='factory' && d.cat==='factory') ok = o.queue.length && o.queue[0].end <= t && free >= 3;
    if (!ok) continue;
    const s = d.size, tx = o.gx + s/2, ty = o.gy + s + 0.25;
    const dist = Math.hypot(tx-w.x, ty-w.y);
    if (dist < bd){ bd = dist; best = {id:o.id, x:tx, y:ty}; }
  }
  return best;
}
function workerAct(w){
  const o = objById(w.tgt.id); claims.delete(w.tgt.id); w.tgt = null;
  if (!o) return;
  const d = defOf(o.type);
  if (d.cat==='field'){ if (cropReady(o)) harvestField(o,true); if (!o.crop && o.last) plantField(o,o.last,true); }
  else if (d.cat==='pen'){ collectPen(o,true); feedPen(o,true); }
  else if (d.cat==='factory') collectFactory(o,true);
  uiDirty = true;
}
function tickWorkers(dt){
  for (const w of workers){
    w.ph += dt*8;
    if (S.resting){ w.state='idle'; if (w.tgt){ claims.delete(w.tgt.id); w.tgt=null; } continue; }
    if (w.state==='work'){ w.wait -= dt; if (w.wait<=0){ workerAct(w); w.state='idle'; w.wait = 0.6; } continue; }
    if (w.tgt){
      const dx = w.tgt.x - w.x, dy = w.tgt.y - w.y, dist = Math.hypot(dx,dy);
      if (!objById(w.tgt.id)){ claims.delete(w.tgt.id); w.tgt = null; continue; }
      if (dist < 0.08){ w.state='work'; w.wait=0.7; continue; }
      const sp = 2.6*dt; w.x += dx/dist*Math.min(sp,dist); w.y += dy/dist*Math.min(sp,dist); w.dir = dx-dy;
      continue;
    }
    w.wait -= dt;
    if (w.wait <= 0){ const j = findJob(w); if (j){ w.tgt = j; claims.add(j.id); w.state='walk'; } else w.wait = 1 + Math.random(); }
  }
}

/* ---------------- Day / wages ---------------- */
function tickDay(dt){
  S.playTime += dt;
  const d = Math.floor(S.playTime / DAY_LEN);
  if (d > S.day){
    S.day = d;
    let wage = 0; for (const r in STAFF) wage += STAFF[r].wage * S.staff[r];
    if (wage > 0){
      if (S.coins >= wage){ S.coins -= wage; S.resting = false; toast(`Payday! Paid 🪙${wage} in wages`); }
      else { S.resting = true; toast('Not enough coins for wages — your staff are resting today'); }
    }
    uiDirty = true;
  }
}

/* ---------------- Camera & coordinates ---------------- */
const cv = $('#c'), ctx = cv.getContext('2d');

/* ---------------- Sprite caches ---------------- */
const spriteCache = new Map();
function cached(key, w, h, fn){

  if (!c){ c = document.createElement('canvas'); c.width = w*2; c.height = h*2; const g = c.getContext('2d'); g.scale(2,2); fn(g); spriteCache.set(key, c); }

}
function emojiSprite(e, size){

function treeSprite(snow, v){
  return cached('tree'+snow+v, 56, 74, g=>{
    const cx = 28, base = 66;
    g.fillStyle='rgba(30,60,40,.22)'; g.beginPath(); g.ellipse(cx, base, 17, 7, 0, 0, 7); g.fill();
    g.fillStyle='#7A4A26'; g.fillRect(cx-3.5, base-18, 7, 18);
    if (v===2){ // pine
      const layers = [[base-14,22,20],[base-28,17,18],[base-40,12,16]];
      for (const [y,w,h] of layers){
        g.fillStyle='#2F8A4A'; g.beginPath(); g.moveTo(cx,y-h); g.lineTo(cx+w,y); g.lineTo(cx-w,y); g.closePath(); g.fill();
        g.fillStyle='#3FA35B'; g.beginPath(); g.moveTo(cx,y-h); g.lineTo(cx,y); g.lineTo(cx-w,y); g.closePath(); g.fill();
        if (snow){ g.fillStyle='#F7FBFF'; g.beginPath(); g.moveTo(cx,y-h); g.lineTo(cx+w*0.55,y-h*0.45); g.quadraticCurveTo(cx,y-h*0.25,cx-w*0.55,y-h*0.45); g.closePath(); g.fill(); }
      }
      return;
    }
    const col = v===1 ? ['#3D9B45','#55B55A','#6FCB66'] : ['#3A8F3E','#4FAE4E','#67C25E'];
    const blobs = [[cx-11,base-26,12],[cx+11,base-26,12],[cx,base-30,14],[cx-7,base-42,11],[cx+7,base-42,11],[cx,base-50,10]];
    for (const [x,y,r] of blobs){ g.fillStyle=col[0]; g.beginPath(); g.arc(x,y+2,r,0,7); g.fill(); }
    for (const [x,y,r] of blobs){ g.fillStyle=col[1]; g.beginPath(); g.arc(x-1,y,r-1.5,0,7); g.fill(); }
    for (const [x,y,r] of blobs){ g.fillStyle=col[2]; g.beginPath(); g.arc(x-3,y-3,r*0.45,0,7); g.fill(); }
    if (snow){
      g.fillStyle='#F7FBFF';
      for (const [x,y,r] of blobs){ g.beginPath(); g.ellipse(x-1,y-r*0.55,r*0.85,r*0.42,0,Math.PI,0); g.fill(); }
      g.fillStyle='#DCE9F6'; g.beginPath(); g.ellipse(cx, base-2, 15, 5, 0, 0, 7); g.fill();
    }
  });
}

/* ---------------- Drawing primitives ---------------- */
function poly(pts, fill, stroke, lw){
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y); ctx.closePath();
  if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  if (stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = lw||1; ctx.stroke(); }
}
const up = (p,h) => ({x:p.x, y:p.y-h});
const lerp = (a,b,t) => ({x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t});
function footprint(gx,gy,s,inset=0){
  return {T:gridToWorld(gx+inset,gy+inset), R:gridToWorld(gx+s-inset,gy+inset), B:gridToWorld(gx+s-inset,gy+s-inset), L:gridToWorld(gx+inset,gy+s-inset)};
}
function faceQuad(A,B,u0,u1,v0,v1){ const p0 = lerp(A,B,u0), p1 = lerp(A,B,u1); return [up(p0,v0), up(p1,v0), up(p1,v1), up(p0,v1)]; }
function shadowUnder(f, k=0.18){ poly([f.T,f.R,f.B,f.L], `rgba(20,50,20,${k})`); }

/* house body with gable roof (ridge along gx) */
function house(gx,gy,s,inset,h,rh,wall,roof,opts={}){
  const f = footprint(gx,gy,s,inset);
  // walls
  poly([f.L,f.B,up(f.B,h),up(f.L,h)], shade(wall,-0.02), 'rgba(60,40,20,.25)');
  poly([f.B,f.R,up(f.R,h),up(f.B,h)], shade(wall,-0.2), 'rgba(60,40,20,.25)');
  // base strip
  poly(faceQuad(f.L,f.B,0,1,0,5), shade(wall,-0.35)); poly(faceQuad(f.B,f.R,0,1,0,5), shade(wall,-0.45));
  if (opts.details) opts.details(f, h);
  // roof with overhang
  const o = 0.16, g = footprint(gx,gy,s,inset-o);
  const T = up(g.T,h-2), R = up(g.R,h-2), B = up(g.B,h-2), L = up(g.L,h-2);
  const m1 = up(lerp(f.T,f.L,0.5),h+rh), m2 = up(lerp(f.R,f.B,0.5),h+rh);
  const m1o = lerp(m1, lerp(T,L,0.5), 0) , m2o = {x:m2.x+(m2.x-m1.x)*0.06, y:m2.y+(m2.y-m1.y)*0.06};
  const m1b = {x:m1o.x-(m2.x-m1.x)*0.06, y:m1o.y-(m2.y-m1.y)*0.06};
  poly([T,R,m2o,m1b], shade(roof,-0.25));
  // gable end (right side)
  poly([up(f.R,h),up(f.B,h),m2], shade(wall,-0.2), 'rgba(60,40,20,.25)');
  if (opts.gableWin){ const c = up(lerp(f.R,f.B,0.5), h+rh*0.35); ctx.fillStyle='#5D8FC9'; ctx.beginPath(); ctx.arc(c.x,c.y,4,0,7); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke(); }
  poly([L,B,m2o,m1b], roof, shade(roof,-0.35), 1);
  // roof shingle lines
  ctx.strokeStyle = shade(roof,-0.15); ctx.lineWidth = 1;
  for (let i=1;i<4;i++){ const a = lerp(L,m1b,i/4), b = lerp(B,m2o,i/4); ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
  poly([L,B,lerp(B,m2o,0.08),lerp(L,m1b,0.08)], shade(roof,-0.3));

}
function windowOn(A,B,u,v,w,hh,frame='#fff',glass='#6FA8E0'){
  poly(faceQuad(A,B,u-0.02,u+w+0.02,v-2,v+hh+2), frame);
  poly(faceQuad(A,B,u,u+w,v,v+hh), glass);
  const m = faceQuad(A,B,u+w/2,u+w/2,v,v+hh); ctx.strokeStyle=frame; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(m[0].x,m[0].y); ctx.lineTo(m[3].x,m[3].y); ctx.stroke();
}
function doorOn(A,B,u,w,hh,col){ poly(faceQuad(A,B,u-0.02,u+w+0.02,0,hh+2), '#fff'); poly(faceQuad(A,B,u,u+w,0,hh), col); }
function signPlaque(p, e){
  ctx.fillStyle='#fff'; ctx.strokeStyle='#B98A4A'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(p.x,p.y,9.5,0,7); ctx.fill(); ctx.stroke();
  drawEmoji(ctx, e, p.x, p.y+0.5, 12);

function chimney(p, h, smoke){
  poly([{x:p.x-4,y:p.y},{x:p.x+4,y:p.y+2},{x:p.x+4,y:p.y-h+2},{x:p.x-4,y:p.y-h}], '#9A5B3C');
  poly([{x:p.x-4,y:p.y-h},{x:p.x+4,y:p.y-h+2},{x:p.x+6,y:p.y-h},{x:p.x-2,y:p.y-h-2}], '#6E3E28');

}

/* ---------------- Object renderers ---------------- */
let perfT = 0;
function drawField(o){
  const f = footprint(o.gx,o.gy,2,0.06);
  poly([f.T,f.R,f.B,f.L], '#A86C3B');

    const p = toScreen(f.w); ctx.globalAlpha = 1-k*k; ctx.font='17px "Lilita One",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=4; ctx.strokeStyle='rgba(40,30,10,.7)'; ctx.strokeText(f.text, p.x, p.y-30-k*36); ctx.fillStyle='#fff'; ctx.fillText(f.text, p.x, p.y-30-k*36); ctx.globalAlpha = 1; }
}
function burst(x,y,n){ for (let i=0;i<n;i++){ const a = Math.random()*7, v = 2+Math.random()*5; parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,c:['#FFC83A','#5CBF3A','#3D8EE6','#E5483D','#F27BA8'][i%5],l:1}); } }
function drawParts(){ for (let i=parts.length-1;i>=0;i--){ const p = parts[i]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.25; p.l-=0.02; if (p.l<=0){ parts.splice(i,1); continue; } ctx.globalAlpha=p.l; ctx.fillStyle=p.c; ctx.fillRect(p.x-3,p.y-3,6,6); } ctx.globalAlpha=1; }
function drawSnow(){
  if (!flakes.length) for (let i=0;i<45;i++) flakes.push({x:Math.random(),y:Math.random(),s:1+Math.random()*2.5,v:0.02+Math.random()*0.04,ph:Math.random()*6});
  ctx.fillStyle='rgba(255,255,255,.85)';
  for (const f of flakes){ f.y += f.v/60; if (f.y > 1.02){ f.y = -0.02; f.x = Math.random(); } const x = (f.x + Math.sin(perfT/1500+f.ph)*0.01)*W; ctx.beginPath(); ctx.arc(x, f.y*H, f.s, 0, 7); ctx.fill(); }
}

/* ---------------- Input ---------------- */
const ptrs = new Map(); let drag = null, pinch = null;
cv.addEventListener('pointerdown', e=>{
  audioInit();
  try { cv.setPointerCapture(e.pointerId); } catch(_) {}
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1) drag = {sx:e.clientX, sy:e.clientY, cx:cam.x, cy:cam.y, moved:false, t:performance.now()};
  else if (ptrs.size === 2){ const [a,b] = [...ptrs.values()]; pinch = {d:Math.hypot(a.x-b.x,a.y-b.y)||1, z:cam.z, mid:toWorld((a.x+b.x)/2,(a.y+b.y)/2)}; if (drag) drag.moved = true; }
});
cv.addEventListener('pointermove', e=>{
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size >= 2 && pinch){
    const [a,b] = [...ptrs.values()]; const d = Math.hypot(a.x-b.x,a.y-b.y)||1;
    cam.z = clamp(pinch.z * d/pinch.d, 0.35, 2.2);
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    cam.x = pinch.mid.x - (mx - W/2)/cam.z; cam.y = pinch.mid.y - (my - H/2)/cam.z; clampCam();
  } else if (drag){
    const dx = e.clientX-drag.sx, dy = e.clientY-drag.sy;
    if (!drag.moved && Math.hypot(dx,dy) > 9) drag.moved = true;
    if (drag.moved){ cam.x = drag.cx - dx/cam.z; cam.y = drag.cy - dy/cam.z; clampCam(); }
  }
});
function endPtr(e){
  if (!ptrs.has(e.pointerId)) return;
  ptrs.delete(e.pointerId);
  if (ptrs.size === 0){ if (drag && !drag.moved && e.type==='pointerup') tap(e.clientX, e.clientY); drag = null; pinch = null; }
  else if (ptrs.size === 1){ const [p] = [...ptrs.values()]; drag = {sx:p.x, sy:p.y, cx:cam.x, cy:cam.y, moved:true}; pinch = null; }
}
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('wheel', e=>{ e.preventDefault(); const before = toWorld(e.clientX,e.clientY); cam.z = clamp(cam.z*Math.exp(-e.deltaY*0.0015), 0.35, 2.2); const after = toWorld(e.clientX,e.clientY); cam.x += before.x-after.x; cam.y += before.y-after.y; clampCam(); }, {passive:false});
document.addEventListener('gesturestart', e=>e.preventDefault());

function pointInPoly(x,y,pts){ let c = false; for (let i=0,j=pts.length-1;i<pts.length;j=i++){ const a=pts[i], b=pts[j]; if (((a.y>y)!==(b.y>y)) && (x < (b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)) c = !c; } return c; }
function pickObject(sx,sy){
  const w = toWorld(sx,sy);
  const cands = S.objects.filter(o=>!(placing&&placing.moveId===o.id)).map(o=>{ const s = defOf(o.type).size; return {o, k:o.gx+o.gy+s}; }).sort((a,b)=>b.k-a.k);
  for (const {o} of cands){
    const d = defOf(o.type), s = d.size, f = footprint(o.gx,o.gy,s,0);
    const h = o.type==='path' ? 0 : d.h || 20;
    if (pointInPoly(w.x,w.y,[f.L,f.B,f.R,up(f.R,h),up(f.T,h),up(f.L,h)])) {
      if (o.type==='path'){ continue; }
      return o;
    }
  }
  // paths last
  const g = worldToGrid(w.x,w.y), gx = Math.floor(g.gx), gy = Math.floor(g.gy);
  return S.objects.find(o=>o.type==='path'&&o.gx===gx&&o.gy===gy) || null;
}
function tap(sx,sy){
  if (placing){
    const w = toWorld(sx,sy), g = worldToGrid(w.x,w.y), s = defOf(placing.type).size;
    placing.gx = clamp(Math.floor(g.gx - (s-1)/2), 0, MAP-s); placing.gy = clamp(Math.floor(g.gy - (s-1)/2), 0, MAP-s);
    updatePlaceBar(); return;
  }
  for (let i=bubbleHits.length-1;i>=0;i--){ const b = bubbleHits[i]; if (sx>=b.x && sx<=b.x+b.w && sy>=b.y && sy<=b.y+b.h){ if (b.sign) openSheet('expand', b.sign); else objectTapped(b.o, true); return; } }
  const w = toWorld(sx,sy), g = worldToGrid(w.x,w.y);
  // expansion sign area
  for (let by=0; by<NB; by++) for (let bx=0; bx<NB; bx++) if (expandable(bx,by)){
    const p = gridToWorld(bx*BLOCK+3, by*BLOCK+3); if (Math.abs(w.x-p.x) < 26 && w.y > p.y-56 && w.y < p.y+8){ openSheet('expand',[bx,by]); return; }
  }
  const o = pickObject(sx,sy);
  if (o){ objectTapped(o); return; }
  const gx = Math.floor(g.gx), gy = Math.floor(g.gy);
  if (gx>=0&&gy>=0&&gx<MAP&&gy<MAP&&!isUnlocked(gx,gy)){ const bx = Math.floor(gx/BLOCK), by = Math.floor(gy/BLOCK); if (expandable(bx,by)) { openSheet('expand',[bx,by]); return; } toast('Unlock the land next to your farm first'); }
  closeSheet();
}
function objectTapped(o, fromBubble){
  const d = defOf(o.type);
  if (d.cat==='field'){
    if (cropReady(o)){ harvestField(o); refresh(); return; }
    openSheet('field', o.id); return;
  }
  if (d.cat==='pen'){
    const inf = penInfo(o);
    if (inf.ready){ collectPen(o); if (inf.hungry + inf.ready > 0 && have(PENS[o.type].feed)>0) feedPen(o,true); refresh(); return; }
    if (inf.hungry && have(PENS[o.type].feed) > 0){ feedPen(o); refresh(); return; }
    openSheet('pen', o.id); return;
  }
  if (d.cat==='factory'){ if (factoryDone(o)){ collectFactory(o); refresh(); return; } openSheet('factory', o.id); return; }
  if (d.cat==='farmhouse'){ openSheet('staff'); selectedId = o.id; return; }
  if (d.cat==='barn'){ openSheet('barn'); selectedId = o.id; return; }
  if (d.cat==='depot'){ openSheet('orders'); selectedId = o.id; return; }
  if (d.cat==='obstacle'){ openSheet('obstacle', o.id); return; }
  if (d.cat==='decor'){ openSheet('decor', o.id); return; }
}

/* ---------------- Placement ---------------- */
function startPlacing(type, moveId){
  closeSheet();
  const s = defOf(type).size;
  let gx, gy;
  if (moveId){ const o = objById(moveId); gx = o.gx; gy = o.gy; }
  else {
    const c = worldToGrid(cam.x, cam.y); gx = clamp(Math.floor(c.gx - s/2),0,MAP-s); gy = clamp(Math.floor(c.gy - s/2),0,MAP-s);
    // look for nearest free spot
    let best = null, bd = 1e9;
    for (let y=0;y<=MAP-s;y++) for (let x=0;x<=MAP-s;x++) if (canPlace(type,x,y)){ const dd = (x-gx)**2+(y-gy)**2; if (dd<bd){ bd = dd; best = [x,y]; } }
    if (best){ gx = best[0]; gy = best[1]; }
  }
  placing = {type, gx, gy, moveId: moveId||null};
  const wp = gridToWorld(gx+s/2, gy+s/2); cam.x = wp.x; cam.y = wp.y; clampCam();
  updatePlaceBar();
}
function placeCost(type){
  if (type==='field') return fieldCost();
  const d = defOf(type); return d.cost || 0;
}
function updatePlaceBar(){
  const bar = $('#placeBar');
  if (!placing){ bar.hidden = true; return; }
  const d = defOf(placing.type), ok = canPlace(placing.type, placing.gx, placing.gy, placing.moveId);
  const cost = placing.moveId ? 0 : placeCost(placing.type);
  bar.innerHTML = `<button class="circ no" data-act="placeCancel" aria-label="Cancel">✕</button>
    <div class="pinfo"><b>${esc(placing.moveId?'Move '+d.n:d.n)}</b>${ok?'Tap the map to move it':'<span style="color:var(--redD)">Blocked — tap open green land</span>'}${cost?` · 🪙${fmtN(cost)}`:''}</div>
    <button class="circ ok" data-act="placeOk" aria-label="Place" ${ok?'':'disabled'}>✓</button>`;
  bar.hidden = false;
}
function confirmPlace(){
  if (!placing) return;
  const {type, gx, gy, moveId} = placing;
  if (!canPlace(type,gx,gy,moveId)){ sfx('no'); return; }
  if (moveId){ const o = objById(moveId); o.gx = gx; o.gy = gy; occDirty = true; placing = null; updatePlaceBar(); sfx('tick'); refresh(); return; }
  if (type==='field' && countType('field') >= maxFields()){ toast(`Field limit reached (${maxFields()}). Level up for more.`); placing = null; updatePlaceBar(); return; }
  const cost = placeCost(type); if (!spend(cost)) return;
  addObj(type,gx,gy); sfx('build');
  const d = defOf(type);
  addXP(Math.max(1, Math.round(cost/20)));
  if (d.cat==='decor') S.stats.decor++;
  const c = toScreen(gridToWorld(gx+d.size/2, gy+d.size/2)); burst(c.x, c.y, 14);
  const repeat = type==='field' || d.cat==='decor';
  if (repeat && S.coins >= placeCost(type) && !(type==='field' && countType('field') >= maxFields())){
    // keep placing: hop to next free spot
    let moved = false;
    for (const [dx,dy] of [[d.size,0],[0,d.size],[-d.size,0],[0,-d.size],[d.size,d.size]]) if (canPlace(type,gx+dx,gy+dy)){ placing.gx = gx+dx; placing.gy = gy+dy; moved = true; break; }
    if (!moved) placing = null;
  } else placing = null;
  updatePlaceBar(); refresh();
}

/* ---------------- UI: sheets ---------------- */
function openSheet(kind, id){ if (placing){ placing = null; updatePlaceBar(); } ui.sheet = {kind, id, tab:null}; selectedId = (typeof id === 'number') ? id : null; ui.confirmReset = false; renderSheet(true); }
function closeSheet(){ ui.sheet = null; selectedId = null; $('#sheet').hidden = true; }
function renderSheet(fresh){
  const el = $('#sheet'); if (!ui.sheet){ el.hidden = true; return; }
  const r = buildSheet(ui.sheet); if (!r){ closeSheet(); return; }
  const body = $('#sheetBody'); const st = fresh ? 0 : body.scrollTop;
  $('#sheetTitle').textContent = r.title; body.innerHTML = r.html; el.hidden = false; body.scrollTop = st;
  updateTimers();
}
const ing = (k,n) => `<span class="ing ${have(k)>=n?'ok':'no'}">${ITEMS[k].e}${have(k)}/${n}</span>`;
const lockNote = l => `<span class="sub">🔒 Level ${l}</span>`;
function cd(end, start){ return `<span data-end="${end}">${fmtT(end-now())}</span>`; }
function bar(start, end){ return `<div class="bar"><i data-s="${start}" data-e="${end}"></i></div>`; }
function buildSheet(sh){
  const t = now();
  switch (sh.kind){
    case 'field': {
      const o = objById(sh.id); if (!o) return null;
      if (o.crop && !cropReady(o)){
        const c = CROPS[o.crop], total = c.t*1000*growMult();
        return {title:'Field · '+c.n, html:`<div class="line"><div class="ico">${c.e}</div><div class="mid"><div class="nm">${c.n} growing</div><div class="sub">Ready in ${cd(o.readyAt)}</div>${bar(o.readyAt-total,o.readyAt)}</div><button class="btn orange small" data-act="skipField">Finish 🍀${skipCost(o.readyAt-t)}</button></div>${moveSell(o)}`};
      }
      const cards = Object.keys(CROPS).map(k=>{ const c = CROPS[k], lk = c.lvl > S.level;
        return `<button class="card ${lk?'locked':''} ${o.last===k?'sel':''}" data-act="plant" data-k="${k}" ${lk?'disabled':''}><div class="big">${c.e}</div><div class="nm">${c.n}</div>${lk?lockNote(c.lvl):`<div class="sub">⏱ ${fmtT(c.t*1000*growMult())} · 🪙${c.seed}</div><div class="sub">Harvest 2 · sells ${ITEMS[k].v}</div>`}</button>`; }).join('');
      const empties = S.objects.filter(x=>x.type==='field'&&!x.crop).length;
      const tractor = S.upg.tractor ? `<div class="toggle"><span>🚜 Plant all ${empties} empty fields</span><button class="sw ${S.settings.plantAll?'on':''}" data-act="togglePlantAll" aria-label="Plant all"></button></div>` : `<div class="note">Tip: buy the Tractor in the Garage to plant every empty field at once.</div>`;
      return {title:'Plant a crop', html:`${tractor}<div class="grid">${cards}</div>${moveSell(o)}`};
    }
    case 'pen': {
      const o = objById(sh.id); if (!o) return null; const d = PENS[o.type], inf = penInfo(o);
      const slots = o.slots.map(sl=>{ if (!sl) return `<div class="slot">${'💤'}<em>hungry</em></div>`; if (sl<=t) return `<div class="slot full done">${ITEMS[d.out].e}<em>ready</em></div>`; return `<div class="slot full">${ITEMS[d.feed].e}<em>${cd(sl)}</em></div>`; }).join('');
      const acost = d.acost*o.slots.length;
      return {title:d.n, html:`
        <div class="line"><div class="ico">${ITEMS[d.out].e}</div><div class="mid"><div class="nm">${ITEMS[d.feed].e} ${ITEMS[d.feed].n} → ${ITEMS[d.out].n}</div><div class="sub">${fmtT(d.t*1000*workMult())} each · in barn: ${ITEMS[d.feed].e} ${have(d.feed)}</div></div></div>
        <div class="slots">${slots}</div>
        <div class="btnrow">
          <button class="btn" data-act="penCollect" ${inf.ready?'':'disabled'}>Collect ${inf.ready||''}</button>
          <button class="btn blue" data-act="penFeed" ${inf.hungry && have(d.feed)?'':'disabled'}>Feed ${inf.hungry?Math.min(inf.hungry,have(d.feed)):''}</button>
          ${inf.busy?`<button class="btn orange" data-act="penSkip">Finish 🍀${skipCost(inf.next-t)}</button>`:''}
        </div>
        ${o.slots.length < d.max ? `<div class="line"><div class="ico">➕</div><div class="mid"><div class="nm">Add another ${d.animal==='bee'?'hive':d.animal}</div><div class="sub">${o.slots.length}/${d.max} owned</div></div><button class="btn small" data-act="penBuy">🪙${fmtN(acost)}</button></div>` : `<div class="note">This ${d.n} is full — ${d.max} of ${d.max}.</div>`}
        ${moveSell(o)}`};
    }
    case 'factory': {
      const o = objById(sh.id); if (!o) return null; const f = FACTORIES[o.type];
      let first = true;
      const slots = []; for (let i=0;i<o.cap;i++){ const j = o.queue[i]; if (!j){ slots.push('<div class="slot"></div>'); continue; } const r = f.recipes[j.r];
        if (j.end<=t) slots.push(`<div class="slot full done">${ITEMS[r.out].e}<em>ready</em></div>`);

      return {title:`Barn · ${barnUsed()}/${barnCap()}`, html:`
        <div class="line"><div class="ico">🏚️</div><div class="mid"><div class="nm">Storage ${barnUsed()} / ${barnCap()}</div><div class="bar"><i style="width:${Math.min(100,barnUsed()/barnCap()*100)}%"></i></div></div><button class="btn small" data-act="barnUp">+30 · 🪙${fmtN(barnUpCost())}</button></div>

    }
    case 'orders': {
      const cards = S.orders.map((o,i)=>{
        if (o.wait) return `<div class="order"><div class="wait">🚚 New order in ${cd(o.wait)}</div></div>`;

          <div class="rw"><span>🪙${fmtN(orderCoins(o))}</span><span>⭐${o.xp}</span>${o.clovers?'<span>🍀1</span>':''}</div>
          <div class="btnrow" style="justify-content:center"><button class="btn small" data-act="deliver" data-i="${i}" ${ok?'':'disabled'}>Deliver</button><button class="btn small red" data-act="trash" data-i="${i}" aria-label="Replace order">🗑</button></div></div>`; }).join('');
      const cb = charmBonus(), tb = 10*(S.upg.truck||0);
      return {title:'Order Board', html:`<div class="note">Neighbors pay well for these. Bonuses: farm charm +${cb.toFixed(1)}%${tb?`, truck +${tb}%`:''}.</div><div class="ogrid">${cards}</div>`};
    }
    case 'shop': {
      const tab = ui.shopTab;
      const tabs = [['farm','Farming'],['animals','Animals'],['build','Buildings'],['decor','Decor']].map(([k,n])=>`<button class="tab ${tab===k?'on':''}" data-act="shopTab" data-k="${k}">${n}</button>`).join('');
      let cards = '';
      const card = (type, e, name, cost, lvl, sub, owned) => { const lk = lvl > S.level; const dis = lk || owned;
        return `<button class="card ${lk?'locked':''}" data-act="buy" data-k="${type}" ${dis?'disabled':''}><div class="big">${e}</div><div class="nm">${esc(name)}</div>${lk?lockNote(lvl):owned?'<span class="sub">✔ Built</span>':`<div class="sub">${sub}</div><div class="sub">🪙${fmtN(cost)}</div>`}</button>`; };
      if (tab==='farm'){ const full = countType('field') >= maxFields(); cards += `<button class="card" data-act="buy" data-k="field" ${full?'disabled':''}><div class="big">🟫</div><div class="nm">Field</div><div class="sub">${countType('field')}/${maxFields()} fields</div><div class="sub">${full?'Level up for more':'🪙'+fmtN(fieldCost())}</div></button>`; }
      if (tab==='animals') for (const k in PENS){ const d = PENS[k]; cards += card(k, ITEMS[d.out].e, d.n, d.cost, d.lvl, `${d.size}×${d.size} · makes ${ITEMS[d.out].n}`, countType(k)>0); }
      if (tab==='build') for (const k in FACTORIES){ const d = FACTORIES[k]; cards += card(k, d.sign, d.n, d.cost, d.lvl, `${d.size}×${d.size} · ${d.recipes.length} recipes`, countType(k)>0); }
      if (tab==='decor') for (const k in DECOR){ const d = DECOR[k]; cards += card(k, d.e, d.n, d.cost, d.lvl, d.charm?`+${d.charm} charm`:'Walkway', false); }
      const note = tab==='decor' ? `<div class="note">Charm raises order payouts: +0.5% per point (now ${charm()} charm, +${charmBonus().toFixed(1)}%, max +60%).</div>` : tab==='farm' ? `<div class="note">More fields means more crops per round. You can own ${maxFields()} at level ${S.level}.</div>` : '';
      return {title:'Shop', html:`<div class="tabs">${tabs}</div>${note}<div class="grid">${cards}</div>`};
    }
    case 'staff': {
      const into = S.playTime % DAY_LEN; let wage = 0; for (const r in STAFF) wage += STAFF[r].wage*S.staff[r];
      const rows = Object.keys(STAFF).map(r=>{ const d = STAFF[r], lk = d.lvl > S.level, n = S.staff[r], cost = d.cost*(n+1);
        return `<div class="line ${lk?'locked':''}"><div class="ico">${d.e}</div><div class="mid"><div class="nm">${d.n} · ${n}/${d.max}</div><div class="sub">${d.desc}</div><div class="sub">Wage 🪙${d.wage} per day</div></div><div style="display:flex;flex-direction:column;gap:6px">${lk?lockNote(d.lvl):n<d.max?`<button class="btn small" data-act="hire" data-k="${r}">Hire 🪙${fmtN(cost)}</button>`:''}${n?`<button class="btn small red" data-act="fire" data-k="${r}">Let go</button>`:''}</div></div>`; }).join('');
      return {title:'Farmhouse · Staff', html:`<div class="line"><div class="ico">📅</div><div class="mid"><div class="nm">Day ${S.day+1}</div><div class="sub">Payday in ${fmtT((DAY_LEN-into)*1000)} · wages 🪙${wage}/day${S.resting?' · <b style="color:var(--redD)">staff resting (unpaid)</b>':''}</div></div></div>
        <div class="note">Staff work on their own while the game is open. A day lasts ${DAY_LEN/60} minutes of play.</div><div class="list">${rows}</div>`};
    }
    case 'garage': {
      const rows = Object.keys(UPG).map(k=>{ const d = UPG[k], lv = S.upg[k]||0, max = d.lv.length;
        const done = lv >= max, need = done?0:d.lv[lv], lk = !done && need > S.level;
        return `<div class="line ${lk?'locked':''}"><div class="ico">${d.e}</div><div class="mid"><div class="nm">${d.n}${max>1?` · ${lv}/${max}`:''}</div><div class="sub">${d.desc}</div></div>${done?'<span class="sub">✔ Owned</span>':lk?lockNote(need):`<button class="btn small" data-act="upg" data-k="${k}">🪙${fmtN(d.cost[lv])}</button>`}</div>`; }).join('');
      return {title:'Garage · Machinery', html:`<div class="list">${rows}</div>`};
    }
    case 'expand': {
      const [bx,by] = sh.id; const n = S.stats.expansions, cost = expandCost(n), lv = expandLvl(n);
      return {title:'Expand your land', html:`<div class="line"><div class="ico">🗺️</div><div class="mid"><div class="nm">Clear a 6×6 plot of snowy forest</div><div class="sub">Expansion ${n+1} of ${NB*NB-4} · requires level ${lv}</div></div></div>
        <div class="btnrow"><button class="btn" data-act="expand" ${S.level>=lv?'':'disabled'}>${S.level>=lv?'Expand · 🪙'+fmtN(cost):'Reach level '+lv}</button></div>`};
    }
    case 'obstacle': {
      const o = objById(sh.id); if (!o) return null; const d = OBSTACLES[o.type];
      return {title:d.n, html:`<div class="line"><div class="ico">${o.type==='rock'?'🪨':o.type==='wtree'?'🌳':o.type==='bush'?'🌿':'🪵'}</div><div class="mid"><div class="nm">Clear the ${d.n.toLowerCase()}</div><div class="sub">Frees up space · +${3+Math.round(d.cost/5)} XP</div></div><button class="btn" data-act="clear">🪙${d.cost}</button></div>`};
    }
    case 'decor': {
      const o = objById(sh.id); if (!o) return null; const d = DECOR[o.type];
      return {title:d.n, html:`<div class="line"><div class="ico">${d.e}</div><div class="mid"><div class="nm">${d.n}</div><div class="sub">${d.charm?`+${d.charm} charm`:'Walkway'} · sells for 🪙${Math.floor(d.cost/2)}</div></div></div>${moveSell(o)}`};
    }
    case 'settings': {
      return {title:'Settings', html:`
        <div class="toggle"><span>🔊 Sound effects</span><button class="sw ${S.settings.sound?'on':''}" data-act="tSound" aria-label="Sound"></button></div>
        <div class="toggle"><span>❄️ Falling snow</span><button class="sw ${S.settings.snow?'on':''}" data-act="tSnow" aria-label="Snow"></button></div>
        <div class="sec">How to play</div>
        <div class="note"><p>🌾 Tap an empty field to plant. Tap a golden field to harvest.</p><p>🏭 Factories turn crops into goods. Tap one to queue recipes, then tap the bubble to collect.</p><p>🐔 Animals eat feed from the Feed Mill. Tap their bubble to feed or collect.</p><p>📋 Deliver orders for coins and XP. Level up to unlock crops, buildings and land.</p><p>🧑‍🌾 Hire staff at the Farmhouse to harvest and collect for you.</p><p>🤏 Drag to move around, pinch to zoom. Your farm saves automatically and keeps growing while you are away.</p></div>
        <div class="sec">Danger zone</div>
        ${ui.confirmReset?`<div class="note">This erases your whole farm. Are you sure?</div><div class="btnrow"><button class="btn red" data-act="resetYes">Yes, start over</button><button class="btn blue" data-act="resetNo">Keep my farm</button></div>`:`<div class="btnrow"><button class="btn red" data-act="reset">Start a new farm</button></div>`}`};
    }
    case 'quest': {
      const q = QUESTS[S.quest];
      if (!q) return {title:'Goals', html:'<div class="note">You finished every goal. Your farm is a true showpiece — keep expanding, decorating and filling orders!</div>'};
      const p = Math.min(q.p(S), q.n), done = p >= q.n;
      return {title:`Goal ${S.quest+1} of ${QUESTS.length}`, html:`<div class="line"><div class="ico">🎯</div><div class="mid"><div class="nm">${esc(q.t)}</div><div class="sub">${fmtN(p)} / ${fmtN(q.n)}</div><div class="bar"><i style="width:${p/q.n*100}%"></i></div></div></div>
        <div class="note">Reward: 🪙${fmtN(q.r.coins)}${q.r.xp?` · ⭐${q.r.xp}`:''}${q.r.clovers?` · 🍀${q.r.clovers}`:''}</div>
        <div class="btnrow"><button class="btn" data-act="claim" ${done?'':'disabled'}>${done?'Claim reward':'Keep going'}</button></div>`};
    }
  }
  return null;
}
function moveSell(o){
  const d = defOf(o.type); const sellable = d.cat==='decor' || d.cat==='field';
  return `<div class="btnrow" style="justify-content:flex-end"><button class="btn blue small" data-act="move">↔ Move</button>${sellable?`<button class="btn red small" data-act="sellObj">${d.cat==='field'?'Remove field':'Sell'}</button>`:''}</div>`;
}
function updateTimers(){
  const t = now(); let expired = false;
  document.querySelectorAll('#sheetBody [data-end]').forEach(el=>{ const e = +el.dataset.end; el.textContent = fmtT(e-t); if (e <= t && !el.dataset.x){ el.dataset.x = 1; expired = true; } });
  document.querySelectorAll('#sheetBody i[data-s]').forEach(el=>{ const s = +el.dataset.s, e = +el.dataset.e; el.style.width = clamp((t-s)/(e-s)*100,0,100)+'%'; });
  if (expired) setTimeout(()=>renderSheet(), 50);
}

/* ---------------- UI actions ---------------- */
function curObj(){ return ui.sheet && typeof ui.sheet.id === 'number' ? objById(ui.sheet.id) : null; }
const ACTIONS = {
  closeModal(){ $('#modal').hidden = true; },
  plant(el){ const o = curObj(); const k = el.dataset.k; if (!o) return;
    if (!plantField(o,k)) return;
    let n = 1;
    if (S.upg.tractor && S.settings.plantAll) for (const f of S.objects) if (f.type==='field' && !f.crop && S.coins >= CROPS[k].seed){ if (plantField(f,k,true)) n++; }
    sfx('plant'); toast(`Planted ${n} × ${CROPS[k].n}`); closeSheet(); },
  togglePlantAll(){ S.settings.plantAll = !S.settings.plantAll; },
  skipField(){ const o = curObj(); if (o) skipField(o); },
  penCollect(){ const o = curObj(); if (o) collectPen(o); },
  penFeed(){ const o = curObj(); if (o) feedPen(o); },
  penSkip(){ const o = curObj(); if (o) skipPen(o); },
  penBuy(){ const o = curObj(); if (!o) return; const d = PENS[o.type]; if (o.slots.length >= d.max) return; if (!spend(d.acost*o.slots.length)) return; o.slots.push(0); sfx('build'); addXP(5); },
  make(el){ const o = curObj(); if (o) queueRecipe(o, +el.dataset.i); },
  capUp(){ const o = curObj(); if (!o || o.cap >= 6) return; if (!spend(200*Math.pow(2,o.cap-3))) return; o.cap++; sfx('build'); },
  facCollect(){ const o = curObj(); if (o) collectFactory(o); },
  facSkip(){ const o = curObj(); if (o) skipFactory(o); },
  sell1(el){ const k = el.dataset.k; if (have(k)<1) return; addItem(k,-1); addCoins(Math.max(1,Math.ceil(ITEMS[k].v*0.6))); sfx('coin'); },
  sellAll(el){ const k = el.dataset.k; const n = have(k); if (!n) return; addItem(k,-n); const c = n*Math.max(1,Math.ceil(ITEMS[k].v*0.6)); addCoins(c); sfx('coin'); toast(`Sold ${n} ${ITEMS[k].n} for 🪙${c}`); },
  barnUp(){ if (!spend(barnUpCost())) return; S.barnLvl++; sfx('build'); addXP(10); toast(`Barn holds ${barnCap()} now`); },
  deliver(el){ deliver(+el.dataset.i); },
  trash(el){ trashOrder(+el.dataset.i); },
  shopTab(el){ ui.shopTab = el.dataset.k; renderSheet(true); },
  buy(el){ startPlacing(el.dataset.k); },
  hire(el){ const r = el.dataset.k, d = STAFF[r]; if (S.staff[r] >= d.max || d.lvl > S.level) return; if (!spend(d.cost*(S.staff[r]+1))) return; S.staff[r]++; syncWorkers(); sfx('build'); toast(`${d.n} hired! They start right away.`); },
  fire(el){ const r = el.dataset.k; if (S.staff[r] > 0){ S.staff[r]--; syncWorkers(); } },
  upg(el){ const k = el.dataset.k, d = UPG[k], lv = S.upg[k]||0; if (lv >= d.lv.length || d.lv[lv] > S.level) return; if (!spend(d.cost[lv])) return; S.upg[k] = lv+1; sfx('level'); addXP(Math.round(d.cost[lv]/25)); toast(`${d.n} ready!`); },
  expand(){ const [bx,by] = ui.sheet.id; buyExpansion(bx,by); },
  clear(){ const o = curObj(); if (!o) return; const d = OBSTACLES[o.type]; if (!spend(d.cost)) return; S.objects.splice(S.objects.indexOf(o),1); occDirty = true; S.stats.cleared++; addXP(3+Math.round(d.cost/5)); const c = toScreen(gridToWorld(o.gx+0.5,o.gy+0.5)); burst(c.x,c.y,12); sfx('pop'); closeSheet(); },
  move(){ const o = curObj(); if (o) startPlacing(o.type, o.id); },
  sellObj(){ const o = curObj(); if (!o) return; const d = defOf(o.type); if (d.cat==='field'){ if (countType('field') <= 1){ toast('Keep at least one field'); return; } addCoins(10); } else addCoins(Math.floor(d.cost/2)); S.objects.splice(S.objects.indexOf(o),1); occDirty = true; sfx('coin'); closeSheet(); },
  placeOk(){ confirmPlace(); },
  placeCancel(){ placing = null; updatePlaceBar(); },
  tSound(){ S.settings.sound = !S.settings.sound; },
  tSnow(){ S.settings.snow = !S.settings.snow; },
  reset(){ ui.confirmReset = true; },
  resetNo(){ ui.confirmReset = false; },
  resetYes(){ try { localStorage.removeItem(SAVE_KEY); } catch(e) {} workers = []; claims.clear(); newGame(); centerCam(); closeSheet(); syncWorkers(); toast('A fresh farm awaits!'); showWelcome(); },
  claim(){ const q = QUESTS[S.quest]; if (!q || q.p(S) < q.n) return; addCoins(q.r.coins); S.clovers += q.r.clovers||0; S.quest++; sfx('level'); toast(`Goal complete! +🪙${q.r.coins}${q.r.clovers?' +🍀'+q.r.clovers:''}`); burst(80, 90, 24); addXP(q.r.xp||0); if (QUESTS[S.quest]) openSheet('quest'); else closeSheet(); },
};
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  audioInit(); fn(el); save();
  if (ui.sheet && !$('#sheet').hidden) renderSheet(); updateHUD();
});
$('#sheetClose').onclick = closeSheet;
$('#btnShop').onclick = ()=>{ placing = null; updatePlaceBar(); openSheet('shop'); };
$('#btnOrders').onclick = ()=>openSheet('orders');
$('#btnBarn').onclick = ()=>openSheet('barn');
$('#btnStaff').onclick = ()=>openSheet('staff');
$('#btnGarage').onclick = ()=>openSheet('garage');
$('#gear').onclick = ()=>openSheet('settings');
$('#quest').onclick = ()=>openSheet('quest');
$('#lvl').onclick = ()=>toast(`Level ${S.level} · ${fmtN(Math.max(0,xpNeed(S.level)-S.xp))} XP to the next level`);
$('#barnPill').onclick = ()=>openSheet('barn');
$('#btnHarvestAll').onclick = ()=>{ let n = 0, full = false; for (const o of S.objects) if (o.type==='field' && cropReady(o)){ if (harvestField(o,true)) n++; else { full = true; break; } } if (n) toast(`Harvested ${n} field${n>1?'s':''}`); else if (full) toast('Your barn is full — sell goods or upgrade the barn'); else toast('No ripe fields yet'); save(); refresh(); };

/* ---------------- Toast & modal ---------------- */
let toastT = 0;
function toast(msg){ const t = $('#toast'); t.style.bottom = placing ? 'calc(110px + env(safe-area-inset-bottom,0px))' : ''; t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('on'), 2200); }
function showModal(html){ $('#modalBox').innerHTML = html; $('#modal').hidden = false; }
$('#modal').addEventListener('click', e=>{ if (e.target.id==='modal') $('#modal').hidden = true; });
function showWelcome(){
  showModal(`<div style="font-size:54px;line-height:1">🌾</div><h2>Welcome to Clover Creek</h2>
  <div class="note" style="text-align:left"><p>Your new farm sits in a snowy valley. Grow crops, raise animals, run factories and fill orders to turn it into the finest farm around.</p><p>🌾 Tap golden fields to harvest. Tap empty ones to plant.</p><p>📋 Fill orders for coins and XP.</p><p>🎯 Follow the goal card at the top left if you're unsure what to do next.</p><p>🤏 Drag to look around, pinch to zoom.</p></div>
  <button class="btn" data-act="closeModal" style="font-size:18px;padding:10px">Let's farm!</button>`);
  S.welcomed = true;
}

/* ---------------- Sound ---------------- */
let actx = null;
function audioInit(){ if (actx) return; try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e) { actx = null; } }
function tone(f, d, type='sine', vol=0.12, delay=0){
  if (!actx || !S.settings.sound) return;
  try { const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*1.25, t+d); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+d+0.02); } catch(e) {}
}
function sfx(k){
  if (k==='pop') tone(520,0.09,'triangle',0.1);
  else if (k==='plant') { tone(330,0.08,'triangle',0.08); tone(440,0.08,'triangle',0.08,0.06); }
  else if (k==='coin') { tone(880,0.08,'square',0.05); tone(1320,0.14,'square',0.05,0.07); }
  else if (k==='level') { [523,659,784,1046].forEach((f,i)=>tone(f,0.16,'triangle',0.09,i*0.09)); }
  else if (k==='build') { tone(196,0.1,'square',0.06); tone(262,0.12,'square',0.06,0.08); }
  else if (k==='tick') tone(660,0.05,'sine',0.07);
  else if (k==='no') tone(160,0.15,'sawtooth',0.05);
}

/* ---------------- Loop ---------------- */
function centerCam(){ const p = gridToWorld(12, 11); cam.x = p.x; cam.y = p.y; cam.z = clamp(Math.min(W/(TW*9), H/(TH*13)), 0.5, 1.3); clampCam(); }
let lastT = performance.now(), saveAcc = 0, slowAcc = 0;
function frame(){
  const t = performance.now(); const dt = Math.min(0.1, (t-lastT)/1000); lastT = t;
  if (document.visibilityState === 'visible'){
    tickWorkers(dt); tickDay(dt);
    slowAcc += dt;
    if (slowAcc > 0.25){ slowAcc = 0; if (tickOrders()) uiDirty = true; updateTimers(); updateHUD(); }
    saveAcc += dt; if (saveAcc > 5){ saveAcc = 0; save(); }
    if (uiDirty){ uiDirty = false; updateHUD(); if (ui.sheet) renderSheet(); }
    try { render(); } catch(err) { console.error(err); }
  }
  requestAnimationFrame(frame);
}
addEventListener('resize', ()=>{ resize(); clampCam(); });
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState === 'hidden') save(); lastT = performance.now(); });
addEventListener('pagehide', save);

function start(snap){
  resize();
  S = (snap && sanitize(snap)) || load() || newGame();
  occDirty = true; syncWorkers(); centerCam(); updateHUD();
  if (!S.welcomed) showWelcome();
  try { window.claude?.hot?.snapshot?.(() => JSON.parse(JSON.stringify(S))); } catch(e) {}
  requestAnimationFrame(frame);
}
(function boot(){
  const go = d => start(d && d.objects ? d : null);
  try { if (window.claude?.hot?.ready) { window.claude.hot.ready(go); return; } } catch(e) {}
  go(window.claude?.hot?.data ?? null);
})();
</script>
